<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<!-- ต้นฉบับไอคอนแอป (เรนเดอร์เป็น PNG ด้วย Edge headless: ดู CLAUDE.md หัวข้อไอคอน PWA) — เนื้อหาอยู่ในพื้นที่กลาง ~62% ให้ใช้เป็นไอคอน maskable ได้ -->
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0f1e; }
  .bg { position: absolute; inset: 0; background: radial-gradient(circle at 50% 42%, #1f2c63 0%, #0f1735 52%, #070a16 100%); }
  .ring { position: absolute; left: 50%; top: 50%; width: 62vmin; height: 62vmin; transform: translate(-50%, -50%); border-radius: 50%;
          border: 2.6vmin solid #22d3ee; box-shadow: 0 0 5vmin #22d3ee, inset 0 0 5vmin rgba(34, 211, 238, 0.55); }
  .orb { position: absolute; left: 50%; top: 50%; width: 46vmin; height: 46vmin; transform: translate(-50%, -50%); border-radius: 50%;
         background: radial-gradient(circle at 34% 28%, #ffffff 0%, #e6ebf5 36%, #aab4c8 72%, #6e7a94 100%); box-shadow: 0 1.2vmin 3vmin rgba(0, 0, 0, 0.55); }
  .panel { position: absolute; left: 50%; top: 52%; width: 17vmin; height: 19vmin; transform: translate(-50%, -50%);
           background: #10162b; clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); }
  .panel::after { content: ''; position: absolute; inset: 22%; background: #22d3ee; clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); opacity: 0.9; }
  .spark { position: absolute; width: 5vmin; height: 5vmin; border-radius: 50%; background: #a78bfa; box-shadow: 0 0 3vmin #a78bfa; right: 21vmin; top: 22vmin; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="ring"></div>
  <div class="orb"></div>
  <div class="panel"></div>
  <div class="spark"></div>
</body>
</html>
