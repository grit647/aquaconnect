<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1e">
<title>AquaConnect — AI เลขา</title>
<!-- บอท 3 มิติ (ตัวเดียวกับของครีมใน ช.นายท้าย) แสดงด้วย <model-viewer> ของ Google -->
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<link rel="stylesheet" href="ai.css">
</head>
<body class="auth-mode">

<!-- ===== ยังไม่ได้เข้าสู่ระบบ ===== -->
<main id="authPage" class="auth-page">
  <section id="authView" class="auth-card" hidden>
    <div class="auth-logo">🦐 AquaConnect</div>
    <h1>AI เลขาของคุณ</h1>
    <p class="auth-sub">เข้าสู่ระบบหรือสมัครสมาชิกด้วยเบอร์โทรศัพท์ + PIN 6 หลัก</p>

    <div class="tabs" role="tablist">
      <button type="button" class="tab active" id="tabLogin" role="tab">เข้าสู่ระบบ</button>
      <button type="button" class="tab" id="tabRegister" role="tab">สมัครสมาชิก</button>
    </div>

    <p id="lineNote" class="line-note" hidden>เปิดผ่านไลน์ครั้งแรก: สมัครหรือเข้าสู่ระบบด้วยเบอร์ + PIN เพียงครั้งเดียว ระบบจะผูกบัญชีไลน์นี้ให้เอง ครั้งต่อไปเข้าอัตโนมัติไม่ต้องกรอกอีก</p>

    <form id="authForm" novalidate>
      <div id="authError" class="error" role="alert"></div>

      <div class="field" id="nameField" hidden>
        <label for="name">ชื่อ-นามสกุล</label>
        <input id="name" type="text" maxlength="100" autocomplete="name">
      </div>
      <div class="field">
        <label for="phone">เบอร์โทรศัพท์</label>
        <input id="phone" type="tel" inputmode="numeric" maxlength="10" placeholder="08XXXXXXXX" autocomplete="tel">
      </div>
      <div class="field">
        <label for="pin">รหัส PIN 6 หลัก</label>
        <input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="current-password">
        <span class="hint" id="pinHint" hidden>ตั้ง PIN ตัวเลข 6 หลักที่จำง่ายสำหรับคุณ อย่าบอกใคร</span>
      </div>

      <button type="submit" class="btn" id="submitBtn">เข้าสู่ระบบ</button>
    </form>
  </section>
</main>

<!-- ===== เข้าสู่ระบบแล้ว: คุยกับเลขา ===== -->
<div id="app" hidden>

  <div id="botStage" class="state-idle">
    <button id="menuBtn" class="stage-btn left" title="เมนู" aria-label="เมนู">☰</button>
    <div id="stateLabel">พร้อมคุยค่ะ</div>
    <button id="connToggle" class="stage-btn right2" title="เปิด/ปิดรับการเชื่อมต่อข้อมูลของคุณ">🔗 เชื่อมต่อ: เปิด</button>
    <button id="ttsToggle" class="stage-btn right" title="เลขาเสียง — อ่านคำตอบให้ฟัง">🔇 เลขาเสียง</button>
    <div id="ring"></div>
    <div id="avatar" title="โปรไฟล์ไลน์ของคุณ"></div>
    <model-viewer id="bot" src="/models/bot.glb" camera-controls auto-rotate auto-rotate-delay="0"
      rotation-per-second="18deg" camera-orbit="0deg 78deg 90%" field-of-view="32deg"
      interaction-prompt="none" disable-zoom exposure="1.1" shadow-intensity="0"></model-viewer>
  </div>

  <div id="connBar" hidden><span id="connText"></span><button id="connEnd" type="button">จบการใช้ข้อมูล</button></div>

  <div id="chatLog" aria-live="polite"></div>

  <div id="micModeBar">
    <button id="realtimeMicToggle" type="button">🎙️ โหมดปกติ</button>
    <button id="saveMemoryBtn" type="button">💾 จำไว้ให้เลขา</button>
    <button id="connectBtn" type="button">🔗 เชื่อมต่อข้อมูล</button>
  </div>

  <div id="attachTray" hidden></div>

  <form id="inputBar" autocomplete="off">
    <button id="plusBtn" type="button" class="round-btn" aria-label="แนบรูป ไฟล์ หรือลิงก์ให้เลขาอ่าน">＋</button>
    <input id="msgInput" type="text" maxlength="4000" placeholder="พิมพ์ข้อความ..." enterkeyhint="send">
    <button id="micBtn" type="button" class="round-btn" aria-label="พูดกับเลขา">🎤</button>
    <button id="sendBtn" type="submit" class="round-btn" aria-label="ส่ง">➤</button>
  </form>

</div>

<!-- แผ่นเลื่อนขึ้นจากด้านล่าง (ใช้ทั้งเมนู / รายการหัวข้อ / เลือกหมวดที่จะจำ) -->
<div id="sheetOverlay" hidden>
  <div id="sheet" role="dialog" aria-modal="true">
    <div id="sheetTitle"></div>
    <div id="sheetBody"></div>
    <button id="sheetClose" type="button">ปิด</button>
  </div>
</div>

<!-- LIFF SDK ของ LINE: ทำให้หน้าเว็บที่เปิดในไลน์รู้ว่าใครกำลังเปิดอยู่ (เข้าสู่ระบบอัตโนมัติ) — นอกไลน์ไม่ทำอะไร -->
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="ai.js"></script>
</body>
</html>
